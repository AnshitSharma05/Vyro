version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: notification_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notification_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: notification_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/notification_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_key_minimum_32_characters_long
      API_KEY_HASH_SECRET: dev_api_key_hash_secret_minimum_32_characters_long
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: notification_worker
    restart: always
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/notification_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_key_minimum_32_characters_long
      API_KEY_HASH_SECRET: dev_api_key_hash_secret_minimum_32_characters_long
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node src/workers/worker.js

volumes:
  postgres_data:
  redis_data:
