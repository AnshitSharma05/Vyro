name: Performance & Load Testing Benchmark

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration per load scenario (seconds)'
        required: false
        default: '5'
      connections:
        description: 'Concurrent connections'
        required: false
        default: '20'

jobs:
  performance-benchmark:
    name: Run Load Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: notification_load_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/notification_load_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: perf_test_jwt_secret_key_minimum_32_characters_long
      API_KEY_HASH_SECRET: perf_test_api_key_hash_secret_minimum_32_characters_long
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client & Migrate Test DB
        run: |
          cd server
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed Test Data
        run: |
          cd server
          npx prisma db seed

      - name: Start Server Process in Background
        run: |
          cd server
          npm start &
          sleep 3

      - name: Execute Load Test Runner
        run: |
          cd server
          npm run test:load
