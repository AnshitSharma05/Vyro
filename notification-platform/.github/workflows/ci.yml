name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: notification_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/notification_test_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long
      API_KEY_HASH_SECRET: ci_test_api_key_hash_secret_minimum_32_characters_long
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Run Database Migrations on Test Service Container
        run: |
          cd server
          npx prisma migrate deploy

      - name: Execute Server Unit & Integration Tests
        run: |
          cd server
          npm test

      - name: Install SDK Dependencies & Run SDK Unit Tests
        run: |
          cd sdk/node
          npm ci
          npx jest test

      - name: Build Frontend Application
        run: |
          cd client
          npm ci
          npm run build
